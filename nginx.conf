worker_processes 1;
error_log stderr;

events {
  worker_connections 1024;
}

http {
  types {
    text/html                  html htm;
    text/css                   css;
    application/javascript     js;
    application/json           json;
    image/png                  png;
    image/jpeg                 jpeg jpg;
    image/svg+xml              svg;
    image/x-icon               ico;
    font/woff                  woff;
    font/woff2                 woff2;
    application/octet-stream   bin;
  }
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;

  server {
    listen 8080;
    root /workspace/app/dist;

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
