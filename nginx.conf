worker_processes 1;
error_log stderr;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;

  server {
    listen 8080;
    root /workspace/app/dist;

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
